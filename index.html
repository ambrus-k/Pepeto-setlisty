<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // In AI Studio preview environment, HMR WebSocket is disabled by environment constraints.
      if (typeof window !== 'undefined') {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function (url, protocols) {
            const urlStr = String(url || '');
            if (urlStr.includes('vite') || urlStr.includes('@vite') || urlStr.includes('ais-dev')) {
              const dummy = new EventTarget();
              dummy.readyState = 1; // OPEN
              dummy.send = () => {};
              dummy.close = () => {};
              setTimeout(() => {
                dummy.dispatchEvent(new Event('open'));
              }, 0);
              return dummy;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
        }

        const origConsoleError = console.error;
        console.error = function (...args) {
          if (args.some(arg => String(arg?.message || arg || '').includes('WebSocket closed without opened'))) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      }
    </script>
    <title>MobileSheets Setlist Studio</title>
    <meta name="description" content="Profesionální správce a generátor hudebních setlistů pro kapelu s exportem do barevného PDF a MobileSheets XML (.mss) a synchronizací s Google Drive." />
    <meta property="og:title" content="MobileSheets Setlist Studio" />
    <meta property="og:description" content="Profesionální správce a generátor hudebních setlistů pro kapelu s exportem do barevného PDF a MobileSheets XML (.mss) a synchronizací s Google Drive." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SetlistStudio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('setlist_studio_display_settings');
          var parsed = raw ? JSON.parse(raw) : {};
          var theme = parsed.theme === 'light' ? 'light' : 'dark';
          var scaleMap = { 0: 16, 1: 18, 2: 20, 3: 22 };
          var px = scaleMap[parsed.fontScale] || 16;
          var root = document.documentElement;
          root.style.fontSize = px + 'px';
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500/30 selection:text-indigo-900 dark:selection:text-indigo-200 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
